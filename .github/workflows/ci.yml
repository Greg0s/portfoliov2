name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The checks run side by side, each on its own runner: the static checks, the end-to-end suite split in shards, and
# Lighthouse. `check` waits for them all, so the result keeps one name.
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Type check
        run: pnpm check

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Budgets
        run: pnpm budgets

  e2e:
    name: e2e (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # Chromium's desktop and mobile projects, split in three; Playwright balances them test by test.
          - { name: chromium 1/3, browser: chromium, args: --project=desktop --project=mobile --shard=1/3 }
          - { name: chromium 2/3, browser: chromium, args: --project=desktop --project=mobile --shard=2/3 }
          - { name: chromium 3/3, browser: chromium, args: --project=desktop --project=mobile --shard=3/3 }
          # WebKit runs the smoke test alone, so it is the only job that installs it.
          - { name: webkit, browser: webkit, args: --project=webkit }
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Build
        run: pnpm build

      - name: Install Playwright's ${{ matrix.browser }}
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}

      - name: End-to-end tests
        run: pnpm test:e2e ${{ matrix.args }}

      - name: Upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ strategy.job-index }}
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore

  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Build
        run: pnpm build

      - name: Lighthouse
        # Performance under 90 fails the build from step 7 on (implementation plan §2.9). It runs on the runner's Chrome.
        run: pnpm exec lhci autorun

      - name: Upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-report
          path: .lighthouseci/
          retention-days: 14
          if-no-files-found: ignore

  check:
    needs: [static, e2e, lighthouse]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: All checks passed
        run: |
          [ "${{ needs.static.result }}" = success ] && [ "${{ needs.e2e.result }}" = success ] && [ "${{ needs.lighthouse.result }}" = success ]
