<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Rendu Petit Prince</title>
<style>html,body{margin:0;background:transparent;overflow:hidden}</style>
<script type="importmap">
{ "imports": {
  "three": "./node_modules/three/build/three.module.js",
  "three/addons/": "./node_modules/three/examples/jsm/",
  "three-subdivide": "./node_modules/three-subdivide/build/index.module.js"
} }
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { SimplexNoise } from 'three/addons/math/SimplexNoise.js';
import { mergeVertices, mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { LoopSubdivision } from 'three-subdivide';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const q = new URLSearchParams(location.search);
const W = Number(q.get('w') || 1200);
const H = Number(q.get('h') || 1200);
const amb = q.get('amb') || 'noir';
const layer = q.get('layer') || 'planet'; // planet | decor | full
const t = Number(q.get('t') || 0);
const fov = Number(q.get('fov') || 20);
const camY = Number(q.get('cy') || 15.5);
const spread = Number(q.get('spread') || 1);
const dscale = Number(q.get('dscale') || 1);
const format = q.get('fmt') || 'png';

// Nodes left over from modelling: untransformed copies of the rose and the fox (one stem reaches y = 61).
const LEFTOVERS = new Set(['Cube.004', 'Cube.005', 'Cube.006', 'Cylinder.006', 'Cylinder.007', 'Cylinder.008', 'Cylinder.009', 'Cylinder.010', 'Cylinder.011', 'pétale save', 'pétale save.002', 'pétale.004', 'pétale.005', 'pétale.006']);
// Hidden under the coat, without material.
const HIDDEN = new Set(['buste', 'bras droit', 'bras g']);
const DECOR = new Set(['etoile', 'etoile.001', 'etoile.002', 'etoile.003', 'etoile.004', 'planet', 'planet.003', 'planet.004', 'planet.005', 'planet.006', 'planet.007', 'planet.008', 'planet.009', 'Torus.001', 'Torus.002', 'Torus.003']);
const SHOOTING_STAR = 'Cylinder';

const AMB = {
  nuit: {
    exposure: 1.0, env: 0.16,
    hemi: [0x3e5aa6, 0x070b1c, 0.5],
    key: [0xfff0d8, 3.6, [-7, 5.5, -7]],
    fill: [0x4f6fd0, 0.35, [7, 4, 4]],
    rim: [0x86a8ff, 3.4, [5, -6, 6]],
    emissive: [1, 0.86, 0.32], emissiveStrength: 1.6,
    bloom: [0.42, 0.28, 0.0],
    bg: 0x0b1532,
  },
  noir: {
    exposure: 1.0, env: 0.035,
    hemi: [0xffffff, 0x000000, 0.04],
    key: [0xffffff, 0.35, [-6, 6, -8]],
    spot: [0xfff8ee, 7.5, [-3.5, 8, -6.5], [-0.25, 0.75, -1.3], 0.165],
    fill: [0xffffff, 0.04, [7, 4, 4]],
    rim: [0xdfe6ff, 0.9, [-2, -6, -8]],
    emissive: [1, 1, 1], emissiveStrength: 1.3,
    bloom: [0.25, 0.2, 0.0],
    bg: 0x0c0c0d,
  },
  brume: {
    exposure: 0.95, env: 0.34,
    hemi: [0xc9d0da, 0x22252b, 0.55],
    fog: [0x2b2f36, 13.2, 23],
    key: [0xffe6c4, 2.3, [-6, 7, -4]],
    fill: [0xaab6c8, 0.55, [7, 5, 3]],
    rim: [0xffe1bb, 1.6, [3, -7, 7]],
    emissive: [1, 0.93, 0.78], emissiveStrength: 1.1,
    bloom: [0.55, 0.7, 0.0],
    bg: 0x15181d,
  },
};
const A = AMB[amb] || AMB.nuit;

// Light that follows the pointer: a 3x3 grid of key light (or museum spot) positions.
if (q.has('lx')) {
  const lx = Number(q.get('lx'));
  const lz = Number(q.get('lz') || 0);
  if (A.spot) A.spot = [A.spot[0], A.spot[1], A.spot[2], [lx * 1.25, 0.9, lz * 1.25 - 0.45], A.spot[4]];
  else A.key = [A.key[0], A.key[1], [lx * 7.5, 5.5, lz * 7.5 - 2]];
}
// Light that follows the visitor's time of day (the default is night).
const TOD = {
  aube: { key: [0xffb08a, 3.0, [-9, 2.6, 1.5]], fill: [0x8c9cff, 0.55, [7, 3, 4]], hemi: [0xe8a890, 0x141a33, 0.45], spot: 0xffc2a0 },
  jour: { key: [0xfff8f0, 3.4, [-3, 9, -4]], fill: [0xbcd0ff, 0.6, [7, 5, 3]], hemi: [0xbcd4ff, 0x23283a, 0.9], env: 0.35, spot: 0xffffff, spotBoost: 1.3 },
  crepuscule: { key: [0xff7a48, 3.0, [9, 2.4, 1]], fill: [0x7b5cd6, 0.6, [-7, 3, 4]], hemi: [0xd98a7a, 0x120c22, 0.4], spot: 0xffa070 },
};
const tod = TOD[q.get('tod')];
if (tod) {
  if (A.spot) {
    A.spot = [tod.spot, A.spot[1] * (tod.spotBoost || 1), ...A.spot.slice(2)];
    A.hemi = [tod.hemi[0], A.hemi[1], A.hemi[2] * 1.5];
  } else {
    A.key = tod.key;
    A.fill = tod.fill;
    A.hemi = tod.hemi;
    if (tod.env) A.env = tod.env;
  }
}

const rng = (seed) => () => {
  seed = (seed + 0x6d2b79f5) | 0;
  let x = Math.imul(seed ^ (seed >>> 15), 1 | seed);
  x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x;
  return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
};
const randomDir = (r) => {
  const u = r() * 2 - 1;
  const a = r() * Math.PI * 2;
  const s = Math.sqrt(1 - u * u);
  return new THREE.Vector3(s * Math.cos(a), u, s * Math.sin(a));
};

// Planet relief rebuilt procedurally: lumpy surface plus craters, kept calm where the characters stand.
function craterPlanet(detail, seed, calm) {
  const r = rng(seed);
  const noise = new SimplexNoise({ random: r });
  const geo = mergeVertices(new THREE.IcosahedronGeometry(1, detail));
  const craters = [];
  const count = seed === 5 ? 46 : 34 + Math.floor(r() * 26);
  for (let i = 0; i < count; i++) {
    const size = 0.05 + Math.pow(r(), 2.6) * 0.26;
    craters.push({ c: randomDir(r), size, depth: 0.16 + r() * 0.14 });
  }
  const pos = geo.attributes.position;
  const v = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i).normalize();
    let h = 0;
    let amp = 0.03;
    let freq = 1.4;
    for (let o = 0; o < 5; o++) {
      h += amp * noise.noise3d(v.x * freq + 11, v.y * freq, v.z * freq);
      amp *= 0.5;
      freq *= 2.15;
    }
    for (const k of craters) {
      const d = Math.acos(THREE.MathUtils.clamp(v.dot(k.c), -1, 1)) / k.size;
      if (d < 1.7) {
        const bowl = d < 1 ? d * d - 1 : 0;
        const rim = 0.32 * Math.exp(-Math.pow((d - 1.02) / 0.26, 2));
        h += k.size * k.depth * (bowl + rim);
      }
    }
    let keep = 1;
    for (const c of calm) {
      const ang = Math.acos(THREE.MathUtils.clamp(v.dot(c.dir), -1, 1));
      keep *= 1 - (1 - c.floor) * Math.exp(-Math.pow(ang / c.radius, 2));
    }
    v.multiplyScalar(1 + h * keep);
    pos.setXYZ(i, v.x, v.y, v.z);
  }
  geo.computeVertexNormals();
  return geo;
}

// Hair rebuilt as a cluster of petals around a core.
function petalBall(detail, seed) {
  const r = rng(seed);
  const geo = mergeVertices(new THREE.IcosahedronGeometry(1, detail));
  const tips = [];
  for (let i = 0; i < 150; i++) tips.push({ d: randomDir(r), len: 0.22 + r() * 0.3, sharp: 40 + r() * 70 });
  const pos = geo.attributes.position;
  const v = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i).normalize();
    let s = 0;
    for (const tip of tips) {
      const c = v.dot(tip.d);
      if (c > 0) s = Math.max(s, tip.len * Math.pow(c, tip.sharp));
    }
    v.multiplyScalar(0.8 + s);
    pos.setXYZ(i, v.x, v.y, v.z);
  }
  geo.computeVertexNormals();
  return geo;
}

// Hair variants under review (?hair=…), beside the petals above until one is chosen.
// Crumpled curls: ridged noise creases the surface into folded tufts, like the Blender render up close.
function crumpledBall(detail, seed) {
  const noise = new SimplexNoise({ random: rng(seed) });
  const geo = mergeVertices(new THREE.IcosahedronGeometry(1, detail));
  const pos = geo.attributes.position;
  const v = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i).normalize();
    let h = 0;
    let amp = 1;
    let f = 1.4;
    for (let o = 0; o < 2; o++) {
      // Softened ridges (|n| rounded off near 0): folds without sharp, aliasing creases.
      const n = noise.noise3d(v.x * f + o * 7.1, v.y * f, v.z * f);
      h += amp * Math.pow(1 - Math.sqrt(n * n + 0.03), 1.4);
      amp *= 0.4;
      f *= 2.1;
    }
    v.multiplyScalar(0.84 + 0.36 * h);
    pos.setXYZ(i, v.x, v.y, v.z);
  }
  geo.computeVertexNormals();
  return geo;
}

// Locks combed by the wind: longer petals that lean the way the scarf flies (wind: a direction in the hair's space).
function windBall(detail, seed, wind) {
  const r = rng(seed);
  const geo = mergeVertices(new THREE.IcosahedronGeometry(1, detail));
  const tips = [];
  for (let i = 0; i < 150; i++) tips.push({ d: randomDir(r), len: 0.24 + r() * 0.34, sharp: 30 + r() * 50 });
  const pos = geo.attributes.position;
  const v = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i).normalize();
    let s = 0;
    for (const tip of tips) {
      const c = v.dot(tip.d);
      if (c > 0) s = Math.max(s, tip.len * Math.pow(c, tip.sharp));
    }
    v.multiplyScalar(0.8 + s).addScaledVector(wind, 1.1 * s * s);
    pos.setXYZ(i, v.x, v.y, v.z);
  }
  geo.computeVertexNormals();
  return geo;
}

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: layer === 'planet', preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = A.exposure;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.setClearColor(0x000000, 0);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
if (layer === 'decor') scene.background = new THREE.Color(0x000000);
if (layer === 'full') scene.background = new THREE.Color(A.bg);
if (A.fog && layer !== 'decor') scene.fog = new THREE.Fog(A.fog[0], A.fog[1], A.fog[2]);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = A.env;

const center = new THREE.Vector3(0, 0, -0.58);
scene.add(new THREE.HemisphereLight(A.hemi[0], A.hemi[1], A.hemi[2]));
const addDir = ([color, intensity, p], shadow) => {
  const l = new THREE.DirectionalLight(color, intensity);
  l.position.copy(center).add(new THREE.Vector3(...p));
  l.target.position.copy(center);
  scene.add(l, l.target);
  if (shadow) {
    l.castShadow = true;
    l.shadow.mapSize.set(4096, 4096);
    Object.assign(l.shadow.camera, { left: -3.6, right: 3.6, top: 3.6, bottom: -3.6, near: 0.5, far: 30 });
    l.shadow.bias = -0.0002;
    l.shadow.normalBias = 0.015;
    l.shadow.radius = 6;
    l.shadow.blurSamples = 16;
  }
  return l;
};
addDir(A.key, !A.spot);
if (A.spot) {
  // Museum spotlight: a pool of light on the characters, the rest of the planet falls into darkness.
  const [color, intensity, p, aim, angle] = A.spot;
  const spot = new THREE.SpotLight(color, intensity, 0, angle, 1, 0);
  spot.position.copy(center).add(new THREE.Vector3(...p));
  spot.target.position.set(...aim);
  spot.castShadow = true;
  spot.shadow.mapSize.set(4096, 4096);
  spot.shadow.bias = -0.0002;
  spot.shadow.normalBias = 0.015;
  spot.shadow.radius = 6;
  spot.shadow.camera.near = 2;
  spot.shadow.camera.far = 30;
  scene.add(spot, spot.target);
}
addDir(A.fill, false);
addDir(A.rim, false);

const gltf = await new GLTFLoader().setMeshoptDecoder(MeshoptDecoder).loadAsync('./models/' + (q.get('model') || 'petit-prince.glb'));
const root = gltf.scene;
scene.add(root);

const mixer = new THREE.AnimationMixer(root);
gltf.animations.forEach((clip) => mixer.clipAction(clip).play());
mixer.setTime(t);
root.updateMatrixWorld(true);

// Directions (in the planet's local frame) where the prince, the fox and the rose touch the surface.
const byName = (n) => root.getObjectByName(THREE.PropertyBinding.sanitizeNodeName(n));
// A compressed (quantized) file keeps the mesh on an unnamed child of the named node.
const meshIn = (o) => {
  let found = null;
  if (o) o.traverse((c) => { if (!found && c.isMesh) found = c; });
  return found;
};
const planet = meshIn(byName('planet.002'));
const hair = meshIn(byName('planet.001'));
if (q.get('proc') !== '0') {
  // The procedural geometry is in the node's own units: drop any dequantization transform.
  for (const m of [planet, hair]) {
    if (m.parent && m.parent !== root && m !== byName(m === planet ? 'planet.002' : 'planet.001')) {
      m.position.set(0, 0, 0);
      m.quaternion.identity();
      m.scale.set(1, 1, 1);
    }
  }
  root.updateMatrixWorld(true);
}
const toLocal = (name) => {
  const p = new THREE.Vector3();
  byName(name).getWorldPosition(p);
  return planet.worldToLocal(p).normalize();
};
const calm = [
  { dir: toLocal('Cube.001'), radius: 0.42, floor: 0.15 },
  { dir: toLocal('Cube'), radius: 0.38, floor: 0.2 },
  { dir: toLocal('pétale.003'), radius: 0.25, floor: 0.3 },
];
if (q.get('proc') !== '0') {
  planet.geometry = craterPlanet(Number(q.get('detail') || 110), Number(q.get('seed') || 5), calm);
  planet.material.roughness = 0.93;
  planet.material.color.setRGB(0.135, 0.19, 0.27);
  const style = q.get('hair') || 'petales';
  if (style === 'froisse') hair.geometry = crumpledBall(80, 21);
  else if (style === 'vent') {
    // The wind blows where the scarf flies: from the head towards the ribbon's far end, across the prince's up.
    const head = new THREE.Vector3().setFromMatrixPosition(hair.matrixWorld);
    const up = new THREE.Vector3().setFromMatrixColumn(byName('Cube.001').matrixWorld, 1).normalize();
    const ribbon = meshIn(byName('echarpe'));
    const p = new THREE.Vector3();
    let far = head.clone();
    for (let i = 0; i < ribbon.geometry.attributes.position.count; i++) {
      p.fromBufferAttribute(ribbon.geometry.attributes.position, i).applyMatrix4(ribbon.matrixWorld);
      if (p.distanceTo(head) > far.distanceTo(head)) far = p.clone();
    }
    const wind = far.sub(head).projectOnPlane(up).normalize().transformDirection(hair.matrixWorld.clone().invert());
    hair.geometry = windBall(64, 21, wind);
  } else hair.geometry = petalBall(56, 21);
  hair.material.roughness = Number(q.get('hairrough') || 0.62);
  if (q.has('haircolor')) hair.material.color.set(q.get('haircolor'));
}

// Helpers for an export made without Apply Modifiers, where the fox and the coat lose their Mirror and Subdivision.
function mirrorX(geo) {
  const half = geo.clone();
  half.deleteAttribute('normal');
  half.deleteAttribute('uv');
  const other = half.clone();
  const p = other.attributes.position;
  for (let i = 0; i < p.count; i++) p.setX(i, -p.getX(i));
  const idx = other.index.array;
  for (let i = 0; i < idx.length; i += 3) [idx[i + 1], idx[i + 2]] = [idx[i + 2], idx[i + 1]];
  return mergeVertices(mergeGeometries([half, other]), 1e-4);
}
function smooth(geo, iterations) {
  let g = geo.clone();
  if (g.attributes.normal) g.deleteAttribute('normal');
  if (g.attributes.uv) g.deleteAttribute('uv');
  g = LoopSubdivision.modify(mergeVertices(g, 1e-4), iterations, { split: false });
  if (g.attributes.normal) g.deleteAttribute('normal');
  if (g.attributes.uv) g.deleteAttribute('uv');
  g = mergeVertices(g, 1e-5);
  g.computeVertexNormals();
  return g;
}
const meshesOf = (node) => (node.isMesh ? [node] : node.children.filter((c) => c.isMesh));
const subdiv = Number(q.get('subdiv') ?? 2);
// Only for the first export, made without Apply Modifiers: rebuild the mirrored, subdivided fox and coat.
(q.get('fixfox') === '1' ? [['Cube', true], ['Cube.002', true], ['Cube.001', true], ['Cube.003', false]] : []).forEach(([n, mirror]) => {
  for (const mesh of meshesOf(byName(n))) {
    let g = mirror ? mirrorX(mesh.geometry) : mesh.geometry;
    mesh.geometry = subdiv ? smooth(g, subdiv) : (g.computeVertexNormals(), g);
  }
});

// The fox turns its head around its own up axis (the planet's radial direction).
const foxYaw = Number(q.get('fox') || 0);
if (foxYaw) {
  const head = byName('Cube');
  const axis = head.position.clone().normalize();
  head.quaternion.premultiply(new THREE.Quaternion().setFromAxisAngle(axis, THREE.MathUtils.degToRad(foxYaw)));
  head.updateMatrixWorld(true);
}

const holdout = new THREE.MeshBasicMaterial({ color: 0x000000 });
// GLTFLoader sanitizes node names (spaces become underscores, dots are dropped).
const sn = (names) => new Set([...names].map((n) => THREE.PropertyBinding.sanitizeNodeName(n)));
const ROLES = [['leftover', sn(LEFTOVERS)], ['hidden', sn(HIDDEN)], ['decor', sn(DECOR)], ['shoot', sn([SHOOTING_STAR])]];
root.traverse((o) => {
  if (!o.isMesh) return;
  o.userData.role = 'main';
  for (let n = o; n && n !== root; n = n.parent) {
    const hit = ROLES.find(([, set]) => set.has(n.name));
    if (hit) {
      o.userData.role = hit[0];
      break;
    }
  }
});

root.traverse((o) => {
  if (!o.isMesh) return;
  const role = o.userData.role;
  if (role === 'leftover' || role === 'hidden' || role === 'shoot') o.visible = false;
  if (role === 'decor') {
    o.material = o.material.clone();
    o.material.emissive.setRGB(...A.emissive);
    o.material.emissiveIntensity = A.emissiveStrength;
    if (layer === 'planet') o.visible = false;
  }
  if (role === 'main') {
    // The rose casts a hard spot on the planet that reads as a hole: leave it out.
    let inRose = false;
    for (let n = o; n && n !== root; n = n.parent) if (n.name === THREE.PropertyBinding.sanitizeNodeName('pétale.003')) inRose = true;
    o.castShadow = !inRose;
    o.receiveShadow = true;
    if (layer === 'decor') o.material = holdout;
  }
});
// Optionally pull the decor closer to the planet, so the right side of the landing stays clear.
if (spread !== 1 || dscale !== 1) {
  DECOR.forEach((n) => {
    const node = byName(n);
    if (node) {
      node.position.x *= spread;
      node.position.z = node.position.z * (0.5 + spread / 2);
      node.scale.multiplyScalar(dscale);
    }
  });
  root.updateMatrixWorld(true);
}

const camera = new THREE.PerspectiveCamera(fov, W / H, 0.1, 400);
camera.up.set(0, 0, -1);
camera.position.set(center.x, camY, center.z);
camera.lookAt(center);

let canvasUrl;
if (layer === 'planet') {
  renderer.render(scene, camera);
} else {
  const composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));
  composer.addPass(new UnrealBloomPass(new THREE.Vector2(W, H), A.bloom[0], A.bloom[1], layer === 'full' ? 0.92 : A.bloom[2]));
  composer.addPass(new OutputPass());
  composer.render();
}
window.__image = renderer.domElement.toDataURL(format === 'jpg' ? 'image/jpeg' : 'image/png', 0.92);
window.__done = true;
</script>
</body>
</html>
